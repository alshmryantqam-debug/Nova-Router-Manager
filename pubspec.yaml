name: nova_router_manager
description: Nova Router Manager - Flutter application for MikroTik RouterOS administration.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  file_picker: ^10.3.10
  fl_chart: ^0.70.2
  flutter_secure_storage: ^9.2.4
  pdf: ^3.11.1
  printing: ^5.13.4
  http: ^1.2.2
  crypto: ^3.0.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
