name: Nova Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
      - name: Ensure Android platform exists
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml && test -f lib/main.dart
          before="$(sha256sum pubspec.yaml lib/main.dart | sha256sum | cut -d' ' -f1)"
          if [[ ! -f android/gradlew || ( ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ) || ! -f android/app/src/main/AndroidManifest.xml ]]; then
            flutter create . --platforms=android --org com.network.routerosmanager
          fi
          test -f android/gradlew && test -f android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          after="$(sha256sum pubspec.yaml lib/main.dart | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after" || { echo "::error::flutter create changed app source"; exit 1; }
      - name: Configure and verify Android network permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          if not re.search(r'<manifest\b', s) or not re.search(r'<application\b', s):
              sys.exit("AndroidManifest.xml is missing manifest/application root")
          for permission in ("android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"):
              pat = r'<uses-permission\b[^>]*android:name=["\']' + re.escape(permission) + r'["\'][^>]*/?>'
              if not re.search(pat, s):
                  root = re.search(r'<manifest\b[^>]*>', s)
                  s = s[:root.end()] + f'\n    <uses-permission android:name="{permission}" />' + s[root.end():]
          app = re.search(r'<application\b[^>]*>', s)
          tag = app.group(0)
          if re.search(r'\bandroid:usesCleartextTraffic\s*=', tag):
              tag = re.sub(r'\bandroid:usesCleartextTraffic\s*=\s*["\'][^"\']*["\']', 'android:usesCleartextTraffic="true"', tag)
          else:
              tag = tag[:-1] + ' android:usesCleartextTraffic="true">'
          s = s[:app.start()] + tag + s[app.end():]
          p.write_text(s, encoding="utf-8")
          assert 'android:usesCleartextTraffic="true"' in re.search(r'<application\b[^>]*>', s).group(0)
          for permission in ("android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"):
              assert re.search(r'<uses-permission\b[^>]*android:name=["\']' + re.escape(permission) + r'["\'][^>]*/?>', s)
          print("Android permissions verified")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings lib
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-router-manager-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish rolling latest Release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova Router Manager — Latest
          body: |
            أحدث إصدار تلقائي من الفرع الرئيسي.
            نزّل app-release.apk من الأصول أدناه.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
      - name: Publish version-tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
